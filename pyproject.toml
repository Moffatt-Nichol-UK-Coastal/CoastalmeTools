[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "CoastalmeTools"
version = "0.1.0"
authors = [
  { name="Wilf Chun", email="wchun@moffattnichol.com" },
]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "bokeh>=3.4.0",
    "cfgrib>=0.9.14.1",
    "cftime>=1.6.4",
    "datetime>=5.5",
    "dearpygui>=2.0.0",
    "fiona>=1.9.6",
    "geopandas>=1.0.1",
    "humanize>=4.12.2",
    "lxml>=5.3.0",
    "matplotlib>=3.9.1",
    "mpl-tools>=0.4.0",
    "netcdf4>=1.7.1.post1",
    "numpy<2.0.0",
    "pandas>=2.2.2",
    "pathlib>=1.0.1",
    "pyyaml>=6.0",
    "plotly>=6.0.1",
    "pyogrio>=0.9.0",
    "pyqt6>=6.8.1",
    "pytimeparse2>=1.7.1",
    "rasterio>=1.3.10",
    "scikit-image>=0.24.0",
    "scipy>=1.13.1",
    "shapely>=2.0.5",
    "streamlit>=1.44.1",
    "watchdog>=6.0.0",
    "windrose>=1.9.0",
    "xarray>=2024.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/CoastalmeTools --cov-report=html --cov-report=term-missing"
